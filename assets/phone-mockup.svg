<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1000" width="600" height="1000" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <!-- Raycast atmosphere: nebula glow -->
    <radialGradient id="nebula" cx="50%" cy="26.51%" r="75%">
      <stop offset="0%" stop-color="#043f96" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#061225" stop-opacity="0.25"/>
    </radialGradient>

    <!-- Phone bezel gradient (deep charcoal -> graphite) -->
    <linearGradient id="bezel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1b1c1e"/>
      <stop offset="50%" stop-color="#07080a"/>
      <stop offset="100%" stop-color="#040506"/>
    </linearGradient>

    <!-- Inner edge highlight -->
    <linearGradient id="edgeHighlight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="6%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="94%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.05"/>
    </linearGradient>

    <!-- BFM blue header gradient -->
    <linearGradient id="bfmBlue" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a1f5c"/>
      <stop offset="100%" stop-color="#0d2d8a"/>
    </linearGradient>

    <!-- Hero photo simulated gradient (flags blur) -->
    <linearGradient id="heroPhoto" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="25%" stop-color="#0d2d8a"/>
      <stop offset="55%" stop-color="#c9b56b"/>
      <stop offset="80%" stop-color="#7a1a2a"/>
      <stop offset="100%" stop-color="#0a1f5c"/>
    </linearGradient>

    <!-- Subtle vignette overlay on hero -->
    <linearGradient id="heroVignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="60%" stop-color="#0a1f5c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#0a1f5c" stop-opacity="0.85"/>
    </linearGradient>

    <!-- Drop shadow for phone -->
    <filter id="phoneShadow" x="-20%" y="-10%" width="140%" height="130%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="22"/>
      <feOffset dx="0" dy="20" result="off"/>
      <feComponentTransfer><feFuncA type="linear" slope="0.7"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Clip for screen interior -->
    <clipPath id="screenClip">
      <rect x="120" y="60" width="360" height="780" rx="44" ry="44"/>
    </clipPath>

    <!-- Clip for hero image area -->
    <clipPath id="heroClip">
      <rect x="120" y="155" width="360" height="345"/>
    </clipPath>
  </defs>

  <!-- Canvas: void black -->
  <rect x="0" y="0" width="600" height="1000" fill="#040506"/>
  <!-- Atmosphere radial glow -->
  <rect x="0" y="0" width="600" height="1000" fill="url(#nebula)"/>

  <!-- Phone outer shadow / bezel -->
  <g filter="url(#phoneShadow)">
    <!-- Bezel body -->
    <rect x="110" y="50" width="380" height="800" rx="54" ry="54" fill="url(#bezel)"
          stroke="#363739" stroke-width="1"/>
    <!-- Outer subtle highlight ring -->
    <rect x="110.5" y="50.5" width="379" height="799" rx="53.5" ry="53.5" fill="none"
          stroke="#ffffff" stroke-opacity="0.08" stroke-width="1"/>
    <!-- Inner inset cavity -->
    <rect x="118" y="58" width="364" height="784" rx="46" ry="46" fill="#040506"/>
    <!-- Edge highlight overlay -->
    <rect x="118" y="58" width="364" height="784" rx="46" ry="46" fill="url(#edgeHighlight)"/>
  </g>

  <!-- Screen content -->
  <g clip-path="url(#screenClip)">
    <!-- Screen base -->
    <rect x="120" y="60" width="360" height="780" fill="#040506"/>

    <!-- Status bar background (BFM blue extends to top) -->
    <rect x="120" y="60" width="360" height="95" fill="url(#bfmBlue)"/>

    <!-- Status bar text: time -->
    <text x="155" y="92" fill="#ffffff" font-size="15" font-weight="600" letter-spacing="0.2">12:13</text>
    <!-- Mute bell icon (simplified) -->
    <g transform="translate(195,80)" fill="none" stroke="#ffffff" stroke-width="1.4" stroke-linecap="round">
      <path d="M2 8 a5 5 0 0 1 10 0 v3 l1 2 H1 l1 -2 z"/>
      <path d="M5 13.5 a2 2 0 0 0 4 0"/>
      <line x1="0" y1="14" x2="14" y2="0" stroke="#ffffff"/>
    </g>

    <!-- Right side: signal, wifi, battery -->
    <g transform="translate(390,77)" fill="#ffffff">
      <!-- signal bars -->
      <rect x="0" y="9" width="2.5" height="3" rx="0.5"/>
      <rect x="4" y="6.5" width="2.5" height="5.5" rx="0.5"/>
      <rect x="8" y="3.5" width="2.5" height="8.5" opacity="0.4" rx="0.5"/>
      <rect x="12" y="0" width="2.5" height="12" opacity="0.4" rx="0.5"/>
    </g>
    <g transform="translate(415,78)" fill="#ffffff">
      <path d="M9 0 C5 0 1.5 1.5 0 3 L4.5 9 C5.5 7.5 7.5 7.5 9 7.5 C10.5 7.5 12.5 7.5 13.5 9 L18 3 C16.5 1.5 13 0 9 0 Z" transform="scale(0.6)"/>
    </g>
    <!-- Battery -->
    <g transform="translate(440,79)">
      <rect x="0" y="0" width="22" height="11" rx="3" ry="3" fill="none" stroke="#ffffff" stroke-opacity="0.9"/>
      <rect x="22.5" y="3.5" width="1.5" height="4" rx="0.5" fill="#ffffff" fill-opacity="0.6"/>
      <rect x="2" y="2" width="18" height="7" rx="1.5" fill="#ffffff"/>
      <text x="4" y="8.5" fill="#0a1f5c" font-size="6.5" font-weight="700">97</text>
    </g>

    <!-- Header row: hamburger + BFM logo + Directs button -->
    <g transform="translate(140,108)" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round">
      <line x1="0" y1="0" x2="18" y2="0"/>
      <line x1="0" y1="7" x2="18" y2="7"/>
      <line x1="0" y1="14" x2="18" y2="14"/>
    </g>
    <text x="178" y="125" fill="#ffffff" font-size="24" font-weight="800" letter-spacing="-0.3">BFM</text>

    <!-- Directs pill (red) -->
    <g transform="translate(380,103)">
      <rect x="0" y="0" width="80" height="28" rx="14" fill="#e63946"/>
      <polygon points="10,8 10,20 20,14" fill="#ffffff"/>
      <text x="26" y="18.5" fill="#ffffff" font-size="13" font-weight="600">Directs</text>
    </g>

    <!-- Tabs row -->
    <g font-size="12" font-weight="500">
      <circle cx="135" cy="148" r="3" fill="#e63946"/>
      <text x="143" y="151.5" fill="#ffffff">Guerre en Iran</text>
      <circle cx="232" cy="148" r="3" fill="#e63946"/>
      <text x="240" y="151.5" fill="#ffffff">Hantavirus</text>
      <line x1="312" y1="142" x2="312" y2="155" stroke="#ffffff" stroke-opacity="0.5"/>
      <text x="320" y="151.5" fill="#ffffff" opacity="0.95">International</text>
      <text x="402" y="151.5" fill="#ffffff" opacity="0.95">Politique</text>
    </g>

    <!-- Hero image area -->
    <g clip-path="url(#heroClip)">
      <rect x="120" y="155" width="360" height="345" fill="url(#heroPhoto)"/>
      <!-- Suggested flag stripes diagonal -->
      <g opacity="0.55">
        <rect x="180" y="140" width="40" height="380" fill="#1a3a8c" transform="rotate(6 200 320)"/>
        <rect x="225" y="130" width="55" height="400" fill="#f5f1e0" transform="rotate(6 250 320)"/>
        <rect x="290" y="135" width="50" height="395" fill="#cc2233" transform="rotate(6 315 320)"/>
        <rect x="355" y="130" width="45" height="400" fill="#0a2068" transform="rotate(6 375 320)"/>
        <rect x="410" y="135" width="50" height="395" fill="#c9a23a" transform="rotate(6 430 320)"/>
      </g>
      <!-- Macron silhouette (left) -->
      <ellipse cx="135" cy="330" rx="38" ry="48" fill="#0a0a14" opacity="0.85"/>
      <ellipse cx="138" cy="295" rx="22" ry="26" fill="#1a1a24" opacity="0.85"/>
      <!-- Vignette -->
      <rect x="120" y="155" width="360" height="345" fill="url(#heroVignette)"/>
    </g>

    <!-- LIVE EN COURS badge -->
    <g transform="translate(135,448)">
      <rect x="0" y="0" width="98" height="20" rx="2" fill="#e63946"/>
      <text x="6" y="14" fill="#ffffff" font-size="10" font-weight="700" letter-spacing="0.5">LIVE EN COURS</text>
    </g>

    <!-- Hero headline -->
    <g fill="#ffffff" font-weight="700">
      <text x="135" y="495" font-size="15">DIRECT. Commémorations du 8-Mai:</text>
      <text x="135" y="514" font-size="15">Emmanuel Macron salue les Français</text>
      <text x="135" y="533" font-size="15">présents pour les cérémonies</text>
    </g>

    <!-- Below hero: white feed background -->
    <rect x="120" y="555" width="360" height="240" fill="#ffffff"/>

    <!-- Timeline items -->
    <!-- 12h12 -->
    <rect x="138" y="580" width="9" height="9" fill="#e63946"/>
    <text x="155" y="590" fill="#e63946" font-size="13" font-weight="600">12h12</text>
    <line x1="143" y1="595" x2="143" y2="635" stroke="#d8d8d8" stroke-width="1"/>
    <text x="155" y="617" fill="#0a0a14" font-size="13" font-weight="500">Fin de la cérémonie de commémoration du 8-Mai</text>

    <!-- 11h45 -->
    <rect x="138" y="650" width="9" height="9" fill="#e63946"/>
    <text x="155" y="660" fill="#e63946" font-size="13" font-weight="600">11h45</text>
    <line x1="143" y1="665" x2="143" y2="725" stroke="#d8d8d8" stroke-width="1"/>
    <text x="155" y="687" fill="#0a0a14" font-size="13" font-weight="500">Ministres, présidents du Sénat et de l'Assemblée...</text>
    <text x="155" y="704" fill="#0a0a14" font-size="13" font-weight="500">Le chef de l'État salue les officiels français</text>

    <!-- 11h15 -->
    <rect x="138" y="735" width="9" height="9" fill="#e63946"/>
    <text x="155" y="745" fill="#e63946" font-size="13" font-weight="600">11h15</text>
    <text x="155" y="772" fill="#0a0a14" font-size="13" font-weight="500">Emmanuel Macron salue les porte-drapeaux</text>

    <!-- Bottom tab bar -->
    <rect x="120" y="795" width="360" height="45" fill="#fafafa"/>
    <line x1="120" y1="795" x2="480" y2="795" stroke="#e8e8e8" stroke-width="1"/>
    <g font-size="9" font-weight="500" text-anchor="middle">
      <!-- Accueil (active) -->
      <g transform="translate(160,805)" fill="#1d6fe0">
        <path d="M0 6 L7 0 L14 6 V13 H9 V8 H5 V13 H0 Z" stroke="#1d6fe0" stroke-width="1.2" fill="none"/>
        <text x="7" y="24">Accueil</text>
      </g>
      <!-- Fil actu -->
      <g transform="translate(232,805)" fill="#9a9a9a">
        <circle cx="7" cy="6.5" r="6.5" fill="none" stroke="#9a9a9a" stroke-width="1.2"/>
        <path d="M7 3 V6.5 L10 8.5" stroke="#9a9a9a" stroke-width="1.2" fill="none" stroke-linecap="round"/>
        <text x="7" y="24">Fil actu</text>
      </g>
      <!-- Directs -->
      <g transform="translate(304,805)" fill="#9a9a9a">
        <rect x="0" y="0" width="14" height="13" rx="2" fill="none" stroke="#9a9a9a" stroke-width="1.2"/>
        <polygon points="5,3 5,10 11,6.5" fill="#9a9a9a"/>
        <text x="7" y="24">Directs</text>
      </g>
      <!-- Shorts -->
      <g transform="translate(376,805)" fill="#9a9a9a">
        <rect x="2" y="0" width="11" height="13" rx="1.5" fill="none" stroke="#9a9a9a" stroke-width="1.2"/>
        <rect x="-1" y="2" width="11" height="11" rx="1.5" fill="none" stroke="#9a9a9a" stroke-width="1.2"/>
        <text x="7" y="24">Shorts</text>
      </g>
      <!-- Audio -->
      <g transform="translate(448,805)" fill="#9a9a9a">
        <path d="M0 8 V5 a7 5 0 0 1 14 0 V8" stroke="#9a9a9a" stroke-width="1.2" fill="none"/>
        <rect x="0" y="7" width="3.5" height="6" rx="1" fill="#9a9a9a"/>
        <rect x="10.5" y="7" width="3.5" height="6" rx="1" fill="#9a9a9a"/>
        <text x="7" y="24">Audio</text>
      </g>
    </g>

    <!-- Home indicator -->
    <rect x="245" y="822" width="110" height="4" rx="2" fill="#0a0a14"/>
  </g>

  <!-- Phone notch (Dynamic Island) on top of screen -->
  <rect x="252" y="78" width="96" height="26" rx="13" fill="#040506"/>

  <!-- Side buttons (volume + power) on bezel -->
  <rect x="108" y="160" width="3" height="40" rx="1.5" fill="#1b1c1e"/>
  <rect x="108" y="220" width="3" height="60" rx="1.5" fill="#1b1c1e"/>
  <rect x="108" y="295" width="3" height="60" rx="1.5" fill="#1b1c1e"/>
  <rect x="489" y="220" width="3" height="80" rx="1.5" fill="#1b1c1e"/>

  <!-- Raycast-style dark badge bottom-left -->
  <g transform="translate(40,940)">
    <rect x="0" y="0" width="86" height="22" rx="6" fill="#1b1c1e"/>
    <text x="10" y="15" fill="#ffffff" font-size="11" font-weight="500" letter-spacing="0.5"
          font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">v1.0.0 — bfm</text>
  </g>
</svg>
